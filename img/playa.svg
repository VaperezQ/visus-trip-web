        stroke="#805333"
        stroke-width="20"
        fill="none"/>

  <!-- Hojas de palmera -->
  <g stroke="#228B22"
     stroke-width="17"
     fill="none"
     stroke-linecap="round">
    <path d="M180 110 Q90 40 30 110"/>
    <path d="M180 110 Q180 25 240 20"/>
    <path d="M180 110 Q260 50 340 90"/>
    <path d="M180 110 Q100 130 80 210"/>
    <path d="M180 110 Q260 130 290 200"/>
  </g>

</svg>