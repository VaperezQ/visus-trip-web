<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="450"
     viewBox="0 0 800 450">

  <!-- Cielo -->
  <rect width="800" height="450" fill="#87CEEB"/>

  <!-- Sol -->
  <circle cx="650" cy="95" r="55"
          fill="#FFD166"/>

  <!-- Mar -->
  <rect x="0" y="230" width="800" height="220"
        fill="#00A8CC"/>

  <!-- Arena -->
  <path d="M0 345 Q200 310 400 350
           T800 340 V450 H0 Z"
        fill="#F4D35E"/>

  <!-- Tronco de palmera -->
